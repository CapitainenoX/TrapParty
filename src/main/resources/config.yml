# =====================================================
#                  TrapParty - config.yml
# =====================================================
# Toutes les durées sont en secondes sauf indication.
# Rechargement à chaud : /tpadmin reload

settings:
  language: fr                # fr / en
  prefix: "&8[&cTrap&fParty&8]"
  storage: yaml               # yaml / sqlite (sqlite expérimental)
  auto-restart: true
  use-multiverse: true        # auto-détecté si plugin présent
  debug: false
  audit-log: true             # plugins/TrapParty/logs/events-*.log (JSON-line)
  metrics: true               # bStats anonymes (https://bstats.org)

game:
  min-players: 2
  max-players: 12
  countdown: 20
  preparation-time: 90        # phase construction & pièges
  combat-time: 240            # phase PvP avant suddendeath
  sudden-death-time: 60       # bordure ferme rapidement
  end-time: 8
  pvp-grace-period: 5
  spectator-on-death: true
  allow-rejoin: true
  rejoin-window: 60
  scoped-chat: true           # le chat des joueurs en partie n'est vu que par cette partie
  allowed-commands:           # commandes utilisables en partie (anti-cheat)
    - tparty                  # NOTE: `tp` n'est PAS dans la liste pour éviter
    - trapparty               # de shadow la commande vanilla de téléportation
    - kit
    - shop
    - crafts
    - special
    - items
    - spectate
    - spec
    - msg
    - r
    - tell
    - w
  teams:
    enabled: false
    size: 2

arena:
  templates-folder: "templates"
  active-folder: "active"
  border:
    initial-size: 150
    combat-size: 80
    sudden-death-size: 25
    warning-distance: 5
    damage-per-block: 0.4
  cleanup:
    unload-async: true
    delete-files: true
    delay-after-end: 10

economy:
  # Mode de paiement du shop et des récompenses :
  #   vault  : utilise Vault (persistent across games, recommandé si Vault installé)
  #   coins  : utilise des pièces par partie (RAZ à chaque partie)
  # Si Vault est introuvable mais mode=vault, fallback automatique sur "coins".
  mode: vault
  starting-coins: 50          # pièces de partie au join (mode coins)
  # En mode vault : si le solde du joueur < starting-bonus, on lui crédite
  # la différence pour qu'il ne débute pas à 0 face aux vétérans.
  vault-min-balance: 100
  kill-reward: 25
  trap-kill-bonus: 5          # bonus piège, modéré pour éviter le farm trapmaster
  win-reward: 150
  participation: 25
  daily-streak-bonus: 20

shop:
  enabled: true
  free-item-cooldown: 30      # secondes entre items gratuits
  anti-spam-clicks-per-second: 4
  categories:
    - blocks
    - traps
    - utility
    - consumables
    - redstone
    - mobility

events:
  enabled: true
  min-interval: 60
  max-interval: 150
  chance: 0.75
  pool:
    - storm
    - meteor
    - mutation
    - loot_chest
    - speed_boost
    - low_gravity
    - night_fall

modifiers-vote:
  enabled: true
  vote-time: 15
  options-per-vote: 3

ranked:
  enabled: true
  base-mmr: 1000
  k-factor: 32

rewards:
  daily-quests: true
  win-streak-bonus: true

performance:
  async-world-ops: true
  entity-cleanup-interval: 30
  max-arenas: 16
  particle-distance: 64
  sound-distance: 48

# Tunables internes (rate limits, debounces, TTL). Modifie uniquement si tu
# sais ce que tu fais. Le défaut convient à 99% des serveurs.
internals:
  join-rate-limit-ms: 3000     # délai min entre 2 /tparty join du même joueur
  create-rate-limit-ms: 10000  # délai min entre 2 créations de game sur la même arène
  join-retry-max: 100          # tentatives max avant abandon (monde qui ne charge pas)
  trap-trigger-ttl-ms: 5000    # fenêtre d'attribution d'un kill via piège
  trap-trigger-purge-age-ms: 60000  # âge max avant purge des triggers stales
  stats-flush-debounce-ms: 5000     # delai min entre 2 écritures stats.yml
  drill-cooldown-ms: 1500           # cooldown entre 2 charges du SuperDrill

resource-pack:
  # Active l'envoi automatique du resource pack TrapParty aux joueurs.
  # Tu dois zipper le dossier `resourcepack/` (voir README) et l'héberger
  # sur un CDN/URL HTTPS publique, puis renseigner l'URL et le hash SHA-1.
  enabled: false
  url: ""
  sha1: ""        # 40-char hex SHA-1 du zip ; calculé via `sha1sum trapparty-pack.zip`
  required: false # si true : kick si refusé
  prompt: "&c&lTrapParty&r&7 recommande son resource pack pour profiter de tous les items spéciaux."
